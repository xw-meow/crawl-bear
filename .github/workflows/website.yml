name: Website CI/CD

# 部署前在仓库 Settings 中配置：
#   Variables: COS_BUCKET, COS_REGION, COS_PREFIX
#   Secrets:   COS_SECRET_ID, COS_SECRET_KEY
# 未配置 Variables 时，Deploy job 会自动跳过，只跑 Check & Build。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 如果 COS_PREFIX 指向子目录，资源必须以 /<prefix>/ 开头。
      - name: Compute public base path
        run: |
          set -euo pipefail
          prefix="${{ vars.COS_PREFIX }}"
          prefix="${prefix#/}"
          prefix="${prefix%/}"
          if [ -n "$prefix" ]; then
            echo "VITE_BASE=/$prefix/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          fi

      - name: Build website
        run: pnpm --filter @crawl-bear/website build

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: apps/website/dist
          retention-days: 7

  deploy:
    name: Deploy to Tencent COS
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.COS_BUCKET != '' &&
      vars.COS_REGION != '' &&
      vars.COS_PREFIX != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist

      - name: Install COS CLI
        run: |
          set -euo pipefail
          python3 -m venv .venv-cos
          .venv-cos/bin/pip install --disable-pip-version-check coscmd

      - name: Configure COS credentials
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${COS_SECRET_ID}" ] || [ -z "${COS_SECRET_KEY}" ]; then
            echo "Missing COS_SECRET_ID / COS_SECRET_KEY secrets."
            exit 1
          fi
          .venv-cos/bin/coscmd config \
            -a "${COS_SECRET_ID}" \
            -s "${COS_SECRET_KEY}" \
            -b "${COS_BUCKET}" \
            -r "${COS_REGION}"

      - name: Upload website
        env:
          COS_PREFIX: ${{ vars.COS_PREFIX }}
        run: |
          set -euo pipefail
          if [ -z "${COS_PREFIX}" ] || [ "${COS_PREFIX}" = "/" ]; then
            echo "COS_PREFIX must point to a project directory, not the bucket root."
            exit 1
          fi
          prefix="/${COS_PREFIX#/}"
          prefix="${prefix%/}"
          .venv-cos/bin/coscmd upload -rs --delete -f -y dist/ "${prefix}/"
