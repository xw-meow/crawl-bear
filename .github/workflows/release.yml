name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal macOS package
        env:
          TAURI_TARGET: universal-apple-darwin
        run: pnpm package:macos

      - name: Checksums
        run: shasum -a 256 dist/CrawlBear-macOS.pkg dist/CrawlBear-macOS.zip > dist/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crawlbear-macos
          path: |
            dist/CrawlBear-macOS.pkg
            dist/CrawlBear-macOS.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "CrawlBear $TAG" \
              --notes "macOS 安装包。应用未经过 Apple 公证，首次打开请按 docs/INSTALL-macOS.md 放行。"
          fi
          gh release upload "$TAG" \
            dist/CrawlBear-macOS.pkg \
            dist/CrawlBear-macOS.zip \
            dist/SHA256SUMS \
            --clobber
